# Configuración del instalador para Windows. Se genera con `npm run dist` y queda en dist/.
appId: io.github.lucassarappa.gitono
productName: GitOno
copyright: Copyright © 2026 Lucas Sarappa

directories:
  output: dist
  buildResources: build

# Solo va la app compilada: React y Monaco ya están incluidos en out/ por Vite.
files:
  - out/**/*
  - package.json

win:
  target:
    - nsis
  icon: build/icon.png

nsis:
  oneClick: false
  perMachine: false
  # Siempre en %LOCALAPPDATA%\Programs\GitOno. No se deja elegir la carpeta porque el desinstalador
  # de electron-builder borra la carpeta de instalación completa: si se eligiera, por ejemplo, la
  # carpeta de un proyecto, desinstalar o actualizar la app la borraría entera.
  allowToChangeInstallationDirectory: false
  # Por si igual termina instalada en un proyecto: el desinstalador no borra una carpeta con .git
  # o package.json.
  include: build/installer.nsh
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: GitOno
  artifactName: GitOno-Setup-${version}.exe
