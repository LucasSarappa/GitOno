# Configuración del instalador para Windows. Se genera con `npm run dist` y queda en dist/.
appId: io.github.lucassarappa.gitono
productName: GitOno
copyright: Copyright © 2026 Lucas Sarappa

directories:
  output: dist
  buildResources: build

# Solo va la app compilada: React y Monaco ya están incluidos en out/ por Vite.
files:
  - out/**/*
  - package.json

win:
  target:
    - nsis
  icon: build/icon.png

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: GitOno
  artifactName: GitOno-Setup-${version}.exe
